<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Volumen y Energía</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1b1f2a;--mu:#667;--ac:#d9480f;--bd:#dde;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--tx:#eceef4;--mu:#9aa;--ac:#ff8a4c;--bd:#333846}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#eceef4;--mu:#9aa;--ac:#ff8a4c;--bd:#333846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:1.3rem}
main{max-width:820px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.fig{border:1px dashed var(--bd);border-radius:10px;padding:6px;color:var(--ac)}
.fig svg{width:100%;height:auto;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.fig .f{fill:currentColor;fill-opacity:.15}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 12px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:1rem;color:var(--tx)}.chk input{width:auto}
.res{font-size:1.15rem;margin:4px 0}.res b{color:var(--ac)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}
.na{color:var(--mu)}
@media(max-width:480px){.row{grid-template-columns:1fr}.fig{max-width:160px;margin:auto}}
</style></head><body>
<header><h1>📐 Calculadora de Volumen y Energía</h1></header>
<main>
<section class="card">
<label for="shape">Forma</label><select id="shape"></select>
<div class="row" style="margin-top:12px"><div class="fig"><svg id="svg" viewBox="0 0 120 100"></svg></div>
<div><label for="unit">Unidad de las medidas</label><select id="unit">
<option value="0.1">mm</option><option value="1" selected>cm</option><option value="100">m</option><option value="100000">km</option><option value="2.54">pulgadas</option><option value="30.48">pies</option></select>
<div class="fields" id="fields"></div></div></div>
<label class="chk"><input type="checkbox" id="en"> Calcular energía necesaria para un material</label>
<div id="enbox" hidden><label for="mat">Material</label><select id="mat"></select></div>
<button id="go">Calcular</button>
</section>
<section class="card" id="out" hidden></section>
</main>
<script>
const P=Math.PI,S5=Math.sqrt(5);
const R=(k,l)=>[k,l];
const SH={
"Esfera":{f:[R("r","Radio")],v:a=>4/3*P*a.r**3,s:'<circle class="f" cx="60" cy="50" r="40"/><ellipse cx="60" cy="50" rx="40" ry="11"/>'},
"Semiesfera":{f:[R("r","Radio")],v:a=>2/3*P*a.r**3,s:'<path class="f" d="M15 60A45 45 0 0 1 105 60Z"/><ellipse cx="60" cy="60" rx="45" ry="12"/>'},
"Cubo":{f:[R("a","Lado")],v:a=>a.a**3,s:'<path class="f" d="M20 35h55v55H20z"/><path d="M20 35l25-20h55l-25 20M100 15v55l-25 20"/>'},
"Prisma rectangular":{f:[R("a","Largo"),R("b","Ancho"),R("c","Alto")],v:a=>a.a*a.b*a.c,s:'<path class="f" d="M10 45h70v45H10z"/><path d="M10 45l20-20h70l-20 20M100 25v45l-20 20"/>'},
"Cilindro":{f:[R("r","Radio"),R("h","Altura")],v:a=>P*a.r*a.r*a.h,s:'<path class="f" d="M25 25v55a35 12 0 0 0 70 0V25z"/><ellipse cx="60" cy="25" rx="35" ry="12"/>'},
"Cono":{f:[R("r","Radio base"),R("h","Altura")],v:a=>P*a.r*a.r*a.h/3,s:'<path class="f" d="M60 8L20 80a40 12 0 0 0 80 0z"/><ellipse cx="60" cy="80" rx="40" ry="12"/>'},
"Cono truncado":{f:[R("r","Radio mayor"),R("q","Radio menor"),R("h","Altura")],v:a=>P*a.h/3*(a.r*a.r+a.r*a.q+a.q*a.q),s:'<path class="f" d="M40 15h40l22 65a42 12 0 0 1-84 0z"/><ellipse cx="60" cy="15" rx="20" ry="6"/>'},
"Pirámide (base cuadrada)":{f:[R("a","Lado base"),R("h","Altura")],v:a=>a.a*a.a*a.h/3,s:'<path class="f" d="M60 8L15 75l40 15 50-20z"/><path d="M60 8L55 90M15 75l90-5"/>'},
"Pirámide (base rectangular)":{f:[R("a","Largo base"),R("b","Ancho base"),R("h","Altura")],v:a=>a.a*a.b*a.h/3,s:'<path class="f" d="M60 8L10 70l35 20 65-15z"/><path d="M60 8L45 90"/>'},
"Prisma triangular":{f:[R("b","Base del triángulo"),R("t","Altura del triángulo"),R("L","Largo")],v:a=>a.b*a.t/2*a.L,s:'<path class="f" d="M10 85L40 30l30 55z"/><path d="M40 30l50-15 30 55-50 15M70 85l50-15"/>'},
"Esferoide prolato":{f:[R("a","Semieje polar (largo)"),R("b","Semieje ecuatorial")],v:a=>4/3*P*a.b*a.b*a.a,s:'<ellipse class="f" cx="60" cy="50" rx="26" ry="44"/><ellipse cx="60" cy="50" rx="26" ry="8"/>'},
"Esferoide oblato":{f:[R("a","Semieje polar (corto)"),R("b","Semieje ecuatorial")],v:a=>4/3*P*a.b*a.b*a.a,s:'<ellipse class="f" cx="60" cy="50" rx="50" ry="26"/><ellipse cx="60" cy="50" rx="50" ry="8"/>'},
"Esferoide truncado (redondo)":{f:[R("L","Largo total"),R("b","Radio en el centro"),R("r","Radio de la cara plana")],v:a=>P*a.L/3*(2*a.b*a.b+a.r*a.r),s:'<path class="f" d="M20 38Q60-2 100 38V62Q60 102 20 62Z"/><ellipse cx="20" cy="50" rx="5" ry="12"/><ellipse cx="100" cy="50" rx="5" ry="12"/>'},
"Esferoide truncado (sección cuadrada)":{f:[R("L","Largo total"),R("b","Semilado en el centro"),R("r","Semilado de la cara plana")],v:a=>4*a.L/3*(2*a.b*a.b+a.r*a.r),s:'<path class="f" d="M20 38Q60-2 100 38V62Q60 102 20 62Z"/><path d="M14 40h12v22H14zM94 40h12v22H94zM20 38l-6 2M20 62l-6 0M100 38l6 2M100 62l6 0M60 8v84"/>'},
"Elipsoide":{f:[R("a","Semieje a"),R("b","Semieje b"),R("c","Semieje c")],v:a=>4/3*P*a.a*a.b*a.c,s:'<ellipse class="f" cx="60" cy="50" rx="52" ry="34"/><ellipse cx="60" cy="50" rx="52" ry="10"/><ellipse cx="60" cy="50" rx="20" ry="34"/>'},
"Toro (dona)":{f:[R("R","Radio mayor (centro al tubo)"),R("r","Radio del tubo")],v:a=>2*P*P*a.R*a.r*a.r,s:'<ellipse class="f" cx="60" cy="50" rx="52" ry="34"/><ellipse cx="60" cy="50" rx="20" ry="10"/>'},
"Casquete esférico":{f:[R("r","Radio de la esfera"),R("h","Altura del casquete")],v:a=>P*a.h*a.h*(3*a.r-a.h)/3,s:'<path class="f" d="M20 65A50 50 0 0 1 100 65Z"/><ellipse cx="60" cy="65" rx="40" ry="10"/>'},
"Cápsula":{f:[R("r","Radio"),R("L","Largo del tramo cilíndrico")],v:a=>P*a.r*a.r*a.L+4/3*P*a.r**3,s:'<path class="f" d="M35 20a25 25 0 0 1 50 0v60a25 25 0 0 1-50 0z"/><ellipse cx="60" cy="20" rx="25" ry="7"/><ellipse cx="60" cy="80" rx="25" ry="7"/>'},
"Tetraedro regular":{f:[R("a","Arista")],v:a=>a.a**3/(6*Math.SQRT2),s:'<path class="f" d="M60 8L15 80l45 12 45-12z"/><path d="M60 8v84M15 80l90 0"/>'},
"Octaedro regular":{f:[R("a","Arista")],v:a=>Math.SQRT2/3*a.a**3,s:'<path class="f" d="M60 5L15 50l45 45 45-45z"/><path d="M15 50h90M60 5v90"/><ellipse cx="60" cy="50" rx="45" ry="10"/>'},
"Dodecaedro regular":{f:[R("a","Arista")],v:a=>(15+7*S5)/4*a.a**3,s:'<path class="f" d="M60 6l40 28-15 48H35L20 34z"/><path d="M60 30l22 16-8 26H46l-8-26z M60 6v24M100 34L82 46M85 82l-11-10M35 82l11-10M20 34l18 12"/>'},
"Icosaedro regular":{f:[R("a","Arista")],v:a=>5*(3+S5)/12*a.a**3,s:'<path class="f" d="M60 5l45 25v40L60 95 15 70V30z"/><path d="M60 5L38 50h44zM15 30l23 20M105 30L82 50M15 70l23-20M105 70L82 50M38 50l22 45 22-45"/>'}
};
const N=null,M={
"Acero":[208,568.5,[310,1000],59944.88],"Acero inoxidable":[358,597,1631,58574.59],"Aluminio":[48.75,234,280,35190.2],"Arenisca":[8,[55.16,95],144.7,N],
"Arena":[0.0963,0.17236,[1,1.2],N],"Azufre":[0.197,2.568,[12.41,22.75],1291.77],"Basalto":[20,[60,200],224,N],"Bronce":[297,538,641,N],"Calcio":[[8.22,24],[27,66],[12,60],N],
"Caliza":[10,[50,140],250,N],"Carbono":[11.7,[22,33],51,141159.06],"Cemento/Concreto":[6,[17,20],40,5304],"Cerámica":[3.4,4.53,2393.33,N],"Cobre":[172.37,217.1,330,52455.62],
"Concreto reforzado":[13.8,[26,41.4],99,N],"Cromo":[166.67,194.44,[360.32,417.46],58250.71],"Cuerpo humano":[4.4,7.533,12.9,4638.75],"Diamante":[N,N,110000,215767.74],
"Estaño":[5.5,10.8,11,22317.22],"Granito":[14,[103.42,175],203.25,27050],"Hierro":[20,42.43,90,60915.7],"Hierro forjado":[194.22,308.76,699,N],"Hierro fundido gris":[400,613.5,827,N],
"Hielo":[0.5271,0.825,4.3919,[306.0529,342.78]],"Hueso":[51.6,67.5,170,N],"Ladrillo rojo/barro":[0.51,[2.81,5.65],[19.28,24.37],N],"Latón":[205,531,[489.528,689.476],N],
"Madera (pino rojo)":[4.1369,8.3427,41.8512,[107.1031,8839]],"Madera (roble blanco)":[7.3774,13.7895,51.297,[107.1031,8839]],"Mármol":[[14,26],[62.1,103.42],154.95,N],
"Oro":[50,132,205,39486.35],"Plata":[65,204,300,31177.58],"Pizarra":[15,[103.42,150],172.5,N],"Roca":[8,69,214,25700],"Sílice/Cuarzo":[28.8,[70,93],1100,N],"Silicio":[56.5,67.8,120,34542.6],
"Tierra":[0.15,0.2,[0.4,1],N],"Titanio":[550,760,970,49097.7],"Tungsteno":[400,1412.5,2425,N],"Vidrio balístico":[32.41,38.89,N,N],"Zinc":[45,120,160,15402.32]
};
const MODES=["Fragmentar","Fragmentar violentamente","Pulverizar","Vaporizar"];
const RANKS=[["Below Average Human",60],["Human",106],["Athlete",300],["Street",1.5e4],["Wall",2.092e7],["Small Building",1.046e9],["Building",8.368e9],["Large Building",4.6024e10],["City Block",4.184e11],["Multi-City Block",4.184e12],["Small Town",2.42672e13],["Town",4.184e14],["Large Town",4.184e15],["Small City",2.63592e16],["City",4.184e17],["Mountain",4.184e18],["Large Mountain",1.79912e19],["Island",4.184e20],["Large Island",4.184e21],["Small Country",2.9288e22],["Country",4.184e23],["Large Country",3.17984e24],["Continent",1.855604e25],["Multi-Continent",1.24e29],["Moon",1.81e30]];
const TNT=4184000000;
const $=id=>document.getElementById(id);
const rank=j=>{for(const[n,m]of RANKS)if(j<=m)return n;return"Arriba de Semis"};
const fmt=x=>(x!==0&&(Math.abs(x)>=1e9||Math.abs(x)<1e-3))?x.toExponential(3).replace("e+","e"):x.toLocaleString("es",{maximumFractionDigits:4});
$("shape").innerHTML=Object.keys(SH).map(k=>`<option>${k}</option>`).join("");
$("mat").innerHTML=Object.keys(M).map(k=>`<option>${k}</option>`).join("");
function draw(){const s=SH[$("shape").value];$("svg").innerHTML=s.s;
$("fields").innerHTML=s.f.map(([k,l])=>`<div><label>${l}</label><input type="number" min="0" step="any" data-k="${k}" placeholder="0"></div>`).join("");$("out").hidden=true}
$("shape").onchange=draw;draw();
$("en").onchange=()=>$("enbox").hidden=!$("en").checked;
$("go").onclick=()=>{
const s=SH[$("shape").value],u=+$("unit").value,a={};let ok=true;
document.querySelectorAll("#fields input").forEach(i=>{const v=parseFloat(i.value);if(isNaN(v)||v<0)ok=false;a[i.dataset.k]=v*u});
const o=$("out");o.hidden=false;
if(!ok){o.innerHTML="<p>Ingresa todas las medidas (números positivos).</p>";return}
const cc=s.v(a);
let h=`<div class="res">Volumen: <b>${fmt(cc)} cm³</b></div><div class="res">Volumen: <b>${fmt(cc/1e6)} m³</b></div>`;
if($("en").checked){const m=$("mat").value,d=M[m];
h+=`<h3>Energía para: ${m}</h3><div class="wrap"><table><tr><th>Efecto</th><th>Joules</th><th>Toneladas TNT</th><th>Rango de ataque</th></tr>`;
d.forEach((e,i)=>{if(e===null){h+=`<tr><td>${MODES[i]}</td><td class="na" colspan="3">No Aplica</td></tr>`;return}
const[lo,hi]=Array.isArray(e)?[e[0]*cc,e[1]*cc]:[e*cc,e*cc];
const r=lo===hi?rank(lo):(rank(lo)===rank(hi)?rank(lo):rank(lo)+" → "+rank(hi));
const rg=x=>lo===hi?fmt(lo):fmt(lo)+" – "+fmt(hi);
h+=`<tr><td>${MODES[i]}</td><td>${rg()} J</td><td>${lo===hi?fmt(lo/TNT):fmt(lo/TNT)+" – "+fmt(hi/TNT)}</td><td>${r}</td></tr>`});
h+="</table></div>"}
o.innerHTML=h;o.scrollIntoView({behavior:"smooth"})};
</script></body></html>
